name: Deploy to Cloudflare
'on':
  workflow_dispatch:
    inputs:
      image:
        description: Deploy this image instead of building one (e.g. ghcr.io/owner/affine@sha256:...)
        type: string
        required: false
      deploy:
        description: Deploy to Cloudflare after building (off = only build and push the image)
        type: boolean
        default: true
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      image-name: ${{ steps.meta.outputs.image-name }}
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Check secrets
        env:
          AFFINE_PRO_PUBLIC_KEY: ${{ secrets.AFFINE_PRO_PUBLIC_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IMAGE: ${{ inputs.image }}
          DEPLOY: ${{ inputs.deploy }}
        run: |
          missing=0
          if [ "$DEPLOY" = "true" ]; then
            for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
              if [ -z "$(printenv $name)" ]; then echo "::error::Missing secret $name"; missing=1; fi
            done
          fi
          # Self-hosted servers refuse to start without the license public key
          # compiled into server-native. See .cloudflare/README.md.
          if [ -z "$IMAGE" ] && [ -z "$AFFINE_PRO_PUBLIC_KEY" ]; then
            echo "::error::Missing secret AFFINE_PRO_PUBLIC_KEY"; missing=1
          fi
          exit $missing
      - name: Image metadata
        id: meta
        run: |
          echo "image-name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/affine" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: prepare
    if: ${{ !inputs.image }}
    uses: ./.github/workflows/build-images.yml
    secrets: inherit
    with:
      build-type: stable
      app-version: ${{ needs.prepare.outputs.version }}
      git-short-hash: ${{ needs.prepare.outputs.sha }}
      image-name: ${{ needs.prepare.outputs.image-name }}
      platforms: linux/amd64

  deploy:
    name: Deploy
    needs: [prepare, build]
    if: ${{ inputs.deploy && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .cloudflare
    steps:
      - uses: actions/checkout@v7
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Use the built image
        env:
          IMAGE: ${{ inputs.image || needs.build.outputs.image }}
        run: |
          sed -i "s#\"AFFINE_IMAGE\": \".*\"#\"AFFINE_IMAGE\": \"${IMAGE}\"#" wrangler.jsonc
          grep -n AFFINE_IMAGE wrangler.jsonc
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
